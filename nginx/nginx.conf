#de compras
upstream compras_service {
    server django:8000;
}

upstream stock_service {
    server 127.0.0.1:8082;
}

upstream logistica_service {
    server 127.0.0.1:8083;
}

upstream keycloak_app {
    server keycloak:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 16m;

    location ^~ /api/ {
        return 301 https://api.example.com$request_uri;
    }

    location ^~ /oldprefix/ {
        rewrite ^/oldprefix(/.*)$ /newprefix$1 permanent;
    }

    #redirección raíz a /compras/
    location = / {
        return 301 /compras/;
    }
    #de compras
    location /compras/ {
        proxy_pass http://compras_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /compras;
        proxy_set_header X-Script-Name /compras;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Frame-Options "SAMEORIGIN";
        proxy_set_header X-Content-Type-Options "nosniff";
        proxy_set_header X-XSS-Protection "1; mode=block";
    }

    #de compras archivos estáticos y media
    location /compras/static/ {
        alias /app/staticfiles/;
        autoindex off;
        try_files $uri $uri/ =404;
    }
    # compras media files
    location /compras/media/ {
        alias /app/media/;
        autoindex off;
        try_files $uri $uri/ =404;
    }


    #servidor de auth
    location ~ ^/(auth|realms|resources|js|css|fonts|img)/ {
        proxy_pass http://keycloak_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        
    }
    

    #página de bienvenida por defecto
    location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }

}

