name: Build & Publish Docker image to GHCR

on:
  push:
    tags:
      - "v*"      # Se ejecuta cuando pushéas un tag que empieza con v (v1.0.0, v1.0.1, etc.)

permissions:
  contents: read
  packages: write   # Necesario para subir imágenes a GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: frre-ds/backend-compras-g04

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .                # Carpeta donde está tu Dockerfile (la raíz del repo)
          push: true                # Publicar la imagen en el registro
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
