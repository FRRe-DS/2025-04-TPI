services:
  django:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SITE_URL: http://localhost
      APP_PATH_PREFIX: /compras
      BASE_API_URL: http://nginx/compras/api/
      PRODUCTOS_API_BASE_URL: http://nginx/compras
      STOCK_API_BASE_URL: http://nginx/compras
      LOGISTICA_API_BASE_URL: http://nginx/compras
      USE_MOCK_APIS: "true"
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_BASE_URL: http://localhost:8080
    command: >
      /bin/sh -c "python manage.py collectstatic --noinput &&
      gunicorn Main.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    expose:
      - "8000"
    depends_on:
      - keycloak
    networks:
      - app_net

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    depends_on:
      - django
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    networks:
      - app_net

  keycloak-db:
    image: postgres:16.2
    env_file:
      - keycloak/.env
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -d "$${POSTGRES_DB}" -U "$${POSTGRES_USER}"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.6
    command: start --import-realm
    env_file:
      - keycloak/.env
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db/$${POSTGRES_DB}
      KC_DB_USERNAME: $${POSTGRES_USER}
      KC_DB_PASSWORD: $${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-config:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - app_net

volumes:
  static_data:
  media_data:
  keycloak_db_data:

networks:
  app_net:
